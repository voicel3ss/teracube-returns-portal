services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: teracube
      POSTGRES_PASSWORD: teracube_dev
      POSTGRES_DB: teracube_portal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teracube -d teracube_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - teracube_postgres_data:/var/lib/postgresql/data

volumes:
  teracube_postgres_data:
