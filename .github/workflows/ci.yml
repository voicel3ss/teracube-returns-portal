name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teracube
          POSTGRES_PASSWORD: teracube_ci
          POSTGRES_DB: teracube_portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teracube -d teracube_portal"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://teracube:teracube_ci@localhost:5432/teracube_portal?schema=public
      AUTH_TOKEN_SECRET: ci-auth-token-secret-at-least-32-characters
      PII_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      WEBHOOK_SIGNING_SECRET: ci-webhook-signing-secret-at-least-32-chars
      AUTOMATION_JOB_SECRET: ci-automation-job-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run verify
